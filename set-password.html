<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Set Password</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-ball">●</span>
          <span>Softball</span>
        </a>
      </div>
    </header>

    <main>
      <section class="hero shell admin-hero">
        <p class="eyebrow">Softball League</p>
        <h1>Admin</h1>
        <p class="hero-sub">Create your password</p>
      </section>

      <section class="shell admin-shell">
        <div class="admin-card">
          <h2>Set Your Password</h2>

          <p>Create a password for your administrator account.</p>

          <form id="password-form">
            <div class="admin-field">
              <label for="new-password">Password</label>

              <input
                id="new-password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div class="admin-field">
              <label for="confirm-password">Confirm Password</label>

              <input
                id="confirm-password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <button type="submit" class="filter-btn active admin-login-btn">
              Save Password
            </button>

            <p id="password-message" class="admin-error" hidden></p>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/set-password.js"></script>
  </body>
</html>
