<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-ball">●</span>
          <span>Softball League</span>
        </a>
      </div>
    </header>

    <main>
      <section class="hero shell admin-hero">
        <p class="eyebrow">Softball League</p>
        <h1>Admin</h1>
        <p class="hero-sub">League management</p>
      </section>

      <section class="shell admin-shell">
        <!-- LOGIN -->
        <div id="admin-login" class="admin-card">
          <h2>Admin Login</h2>

          <form id="login-form">
            <div class="admin-field">
              <label for="admin-email">Email</label>
              <input
                id="admin-email"
                type="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="admin-field">
              <label for="admin-password">Password</label>
              <input
                id="admin-password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="filter-btn active admin-login-btn">
              Log In
            </button>

            <button
              type="button"
              id="forgot-password-btn"
              class="admin-forgot-btn"
            >
              Forgot password?
            </button>

            <p id="login-error" class="admin-error" hidden></p>
          </form>
        </div>

        <!-- DASHBOARD -->
        <div id="admin-dashboard" hidden>
          <div class="admin-dashboard-header">
            <div>
              <p class="eyebrow">League Administration</p>
              <h2>Dashboard</h2>
            </div>

            <button id="logout-btn" class="filter-btn">Log Out</button>
          </div>

          <div class="admin-menu">
            <button class="admin-menu-card" data-admin-page="schedule">
              <strong>Schedule</strong>
              <span>Add, edit or cancel games</span>
            </button>

            <button class="admin-menu-card" data-admin-page="scores">
              <strong>Scores</strong>
              <span>Enter final game scores</span>
            </button>

            <button class="admin-menu-card" data-admin-page="teams">
              <strong>Teams</strong>
              <span>Add, rename or deactivate teams</span>
            </button>
          </div>
          <!-- SCORES MANAGER -->
          <section id="scores-manager" class="admin-manager" hidden>
            <button type="button" class="admin-back-btn" data-admin-back>
              ← Back to Dashboard
            </button>

            <div class="admin-section-heading">
              <p class="eyebrow">League Management</p>
              <h2>Scores</h2>
              <p>Enter final scores for completed games.</p>
            </div>

            <div class="admin-filter-row">
              <div class="admin-field">
                <label for="score-league">League</label>

                <select id="score-league">
                  <option value="mens">Men's</option>
                  <option value="coed">Coed</option>
                </select>
              </div>

              <div class="admin-field">
                <label for="score-division">Division</label>

                <select id="score-division"></select>
              </div>
            </div>

            <div id="score-games" class="admin-games"></div>

            <p id="scores-empty" class="admin-empty" hidden>
              No games found for this division.
            </p>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
